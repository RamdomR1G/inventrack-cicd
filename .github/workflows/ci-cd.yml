# CI/CD de InvenTrack
#
#   Análisis de código -> Construir imágenes -+-> Pruebas backend (API)   -+-> Despliegue en AWS EC2 -> Verificación en producción
#                                             +-> Pruebas frontend (E2E)  -+
#                                                  (si algo falla) -> Despliegue bloqueado
#
#  1. lint:     revisa errores en el código Python (ruff) y que el frontend compile (Vite).
#  2. build:    construye las imágenes Docker de la API y del frontend.
#  3. test-api / test-e2e: levantan el sistema completo con Docker Compose y corren la suite
#               Playwright + pytest en paralelo (backend por API y frontend en el navegador).
#               Cada una registra su resultado en OpenObserve.
#  4. deploy:   SOLO si todo lo anterior pasó y es un push a main: entra por SSH a la EC2,
#               actualiza los contenedores y registra el despliegue en OpenObserve.
#  5. verify:   comprueba el sistema publicado (salud, versión, frontend e inicio de sesión).
#  6. blocked:  si falla cualquier etapa previa en main, registra el bloqueo; nunca se abre SSH.
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  O2_URL: ${{ secrets.O2_URL }}
  O2_USER: ${{ secrets.O2_USER }}
  O2_PASSWORD: ${{ secrets.O2_PASSWORD }}
  COMMIT_MESSAGE: ${{ github.event.head_commit.message }}

jobs:
  lint:
    name: Análisis de código
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: "Python (ruff): errores de sintaxis y nombres indefinidos"
        run: |
          pip install ruff
          ruff check --isolated --select E9,F backend scripts tests

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: "Frontend: instalar dependencias y compilar"
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build

  build:
    name: Construir imágenes Docker
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_VERSION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Construir API y frontend
        run: docker compose build

      - name: Listar imágenes
        run: docker images --format "table {{.Repository}}\t{{.Tag}}\t{{.Size}}" | grep -E "REPOSITORY|inventrack"

  test-api:
    name: Pruebas backend (API)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WEB_PORT: "8080"
      BASE_URL: http://localhost:8080
      APP_VERSION: ${{ github.sha }}
      OTEL_SDK_DISABLED: "true"
      ADMIN_EMAIL: admin@inventrack.com
      ADMIN_PASSWORD: Admin123*
    steps:
      - uses: actions/checkout@v4

      - name: Levantar el sistema (PostgreSQL + API + frontend)
        run: docker compose up -d --build --wait --wait-timeout 180

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Instalar Playwright
        run: pip install -r requirements-test.txt

      - name: Ejecutar pruebas del backend
        run: python -m pytest -m api

      - name: Resumen de resultados
        if: always()
        run: python scripts/ci_summary.py "Pruebas backend (API)" >> "$GITHUB_STEP_SUMMARY"

      - name: Registrar resultado en OpenObserve
        if: always()
        run: >
          python scripts/o2_event.py test_result ${{ job.status }}
          --junit reports/junit.xml
          --message "Pruebas de backend ${{ job.status == 'success' && 'aprobadas' || 'fallidas' }} en ${{ github.ref_name }}"
          --extra '{"suite": "api"}'

      - name: Logs de los contenedores (si falló)
        if: failure()
        run: docker compose logs --tail=150

      - name: Publicar reportes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-api-${{ github.run_number }}
          path: reports/
          retention-days: 14

      - name: Apagar contenedores
        if: always()
        run: docker compose down -v

  test-e2e:
    name: Pruebas frontend (E2E)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      WEB_PORT: "8080"
      BASE_URL: http://localhost:8080
      APP_VERSION: ${{ github.sha }}
      OTEL_SDK_DISABLED: "true"
      ADMIN_EMAIL: admin@inventrack.com
      ADMIN_PASSWORD: Admin123*
    steps:
      - uses: actions/checkout@v4

      - name: Levantar el sistema (PostgreSQL + API + frontend)
        run: docker compose up -d --build --wait --wait-timeout 180

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Instalar Playwright y Chromium
        run: |
          pip install -r requirements-test.txt
          python -m playwright install --with-deps chromium

      - name: Ejecutar pruebas del frontend en el navegador
        run: python -m pytest -m e2e

      - name: Resumen de resultados
        if: always()
        run: python scripts/ci_summary.py "Pruebas frontend (E2E)" >> "$GITHUB_STEP_SUMMARY"

      - name: Registrar resultado en OpenObserve
        if: always()
        run: >
          python scripts/o2_event.py test_result ${{ job.status }}
          --junit reports/junit.xml
          --message "Pruebas de frontend ${{ job.status == 'success' && 'aprobadas' || 'fallidas' }} en ${{ github.ref_name }}"
          --extra '{"suite": "e2e"}'

      - name: Logs de los contenedores (si falló)
        if: failure()
        run: docker compose logs --tail=150

      - name: Publicar reportes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-e2e-${{ github.run_number }}
          path: reports/
          retention-days: 14

      - name: Apagar contenedores
        if: always()
        run: docker compose down -v

  deploy:
    name: Despliegue en AWS EC2
    needs: [test-api, test-e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Configurar llave SSH
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2.pem
          chmod 600 ~/.ssh/ec2.pem
          ssh-keyscan -T 15 -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Desplegar por SSH
        id: deploy
        run: |
          start=$(date +%s)
          ssh -i ~/.ssh/ec2.pem -o ConnectTimeout=20 "${{ secrets.EC2_USER || 'ubuntu' }}@${{ secrets.EC2_HOST }}" \
            "APP_SHA=${{ github.sha }} bash -s" < scripts/deploy.sh
          echo "seconds=$(( $(date +%s) - start ))" >> "$GITHUB_OUTPUT"

      - name: Registrar despliegue en OpenObserve
        if: always()
        run: >
          python3 scripts/o2_event.py deploy ${{ job.status }}
          --message "Despliegue ${{ job.status == 'success' && 'completado' || 'fallido' }} en EC2 (${{ github.sha }})"
          --extra '{"target": "aws-ec2", "host": "${{ secrets.EC2_HOST }}", "deploy_seconds": "${{ steps.deploy.outputs.seconds }}", "app_version": "${{ github.sha }}"}'

  verify:
    name: Verificación en producción
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SITE: http://${{ secrets.EC2_HOST }}
      APP_USER: ${{ secrets.APP_USER }}
      APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: API en línea con la versión recién desplegada
        run: |
          short="${GITHUB_SHA::7}"
          for i in $(seq 1 20); do
            body="$(curl -fsS "$SITE/api/health" || true)"
            echo "$body"
            echo "$body" | grep -q "\"$short" && exit 0
            sleep 3
          done
          echo "La EC2 no responde con la versión $short"; exit 1

      - name: Frontend publicado
        run: curl -fsS "$SITE/" | grep -q '<div id="root">'

      - name: Inicio de sesión real contra la EC2
        if: env.APP_PASSWORD != ''
        run: |
          curl -fsS -X POST "$SITE/api/auth/login" -H 'content-type: application/json' \
            -d "$(python3 -c 'import json,os; print(json.dumps({"email": os.environ["APP_USER"], "password": os.environ["APP_PASSWORD"]}))')" \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["access_token"]; print("Sesión iniciada como", d["user"]["email"])'

      - name: Resumen
        if: always()
        run: |
          echo "## Verificación en producción (${{ job.status }})" >> "$GITHUB_STEP_SUMMARY"
          echo "Sistema: $SITE - versión \`${GITHUB_SHA::7}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Registrar verificación en OpenObserve
        if: always()
        run: >
          python3 scripts/o2_event.py verify ${{ job.status }}
          --message "Verificación en producción ${{ job.status == 'success' && 'correcta' || 'fallida' }} (${{ github.sha }})"

  blocked:
    name: Despliegue bloqueado
    needs: [lint, build, test-api, test-e2e]
    if: failure() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Registrar bloqueo en OpenObserve
        run: >
          python3 scripts/o2_event.py deploy_blocked blocked
          --message "Falló una etapa previa (análisis, construcción o pruebas): no se abrió la conexión SSH ni se actualizó la EC2"
      - name: Marcar el bloqueo
        run: |
          {
            echo "## Despliegue bloqueado"
            echo "Falló una etapa previa en el commit \`${GITHUB_SHA::7}\`; la EC2 no se tocó."
            echo ""
            echo "| Etapa | Resultado |"
            echo "|---|---|"
            echo "| Análisis de código | ${{ needs.lint.result }} |"
            echo "| Construir imágenes | ${{ needs.build.result }} |"
            echo "| Pruebas backend (API) | ${{ needs.test-api.result }} |"
            echo "| Pruebas frontend (E2E) | ${{ needs.test-e2e.result }} |"
          } >> "$GITHUB_STEP_SUMMARY"
