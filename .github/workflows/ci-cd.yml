# CI/CD de InvenTrack
#  1. test:   levanta el sistema completo con Docker Compose y corre la suite Playwright + pytest
#             (backend por API y frontend en el navegador). Registra el resultado en OpenObserve.
#  2. deploy: SOLO si las pruebas pasaron y es un push a main: entra por SSH a la EC2,
#             actualiza los contenedores y registra el despliegue en OpenObserve.
#  3. blocked: si las pruebas fallan en main, registra el bloqueo; nunca se abre la conexión SSH.
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  O2_URL: ${{ secrets.O2_URL }}
  O2_USER: ${{ secrets.O2_USER }}
  O2_PASSWORD: ${{ secrets.O2_PASSWORD }}
  COMMIT_MESSAGE: ${{ github.event.head_commit.message }}

jobs:
  test:
    name: Pruebas Playwright (frontend + backend)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      WEB_PORT: "8080"
      BASE_URL: http://localhost:8080
      APP_VERSION: ${{ github.sha }}
      OTEL_SDK_DISABLED: "true"
      ADMIN_EMAIL: admin@inventrack.com
      ADMIN_PASSWORD: Admin123*
    steps:
      - uses: actions/checkout@v4

      - name: Levantar el sistema (PostgreSQL + API + frontend)
        run: docker compose up -d --build --wait --wait-timeout 180

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Instalar Playwright
        run: |
          pip install -r requirements-test.txt
          python -m playwright install --with-deps chromium

      - name: Ejecutar suite de pruebas
        run: python -m pytest

      - name: Resumen de resultados
        if: always()
        run: |
          python - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import json, subprocess, os
          from scripts.o2_event import junit_summary
          s = junit_summary("reports/junit.xml")
          print("## Resultado de las pruebas")
          print(f"| Total | Pasaron | Fallaron | Omitidas | Duración |\n|---|---|---|---|---|")
          print(f"| {s.get('tests_total',0)} | {s.get('tests_passed',0)} | {s.get('tests_failed',0)} | {s.get('tests_skipped',0)} | {s.get('tests_duration_s',0)} s |")
          if s.get("failed_tests"):
              print("\n**Fallidas:** " + s["failed_tests"])
          EOF

      - name: Registrar resultado de pruebas en OpenObserve
        if: always()
        run: >
          python scripts/o2_event.py test_result ${{ job.status }}
          --junit reports/junit.xml
          --message "Pruebas ${{ job.status == 'success' && 'aprobadas' || 'fallidas' }} en ${{ github.ref_name }}"

      - name: Logs de los contenedores (si falló)
        if: failure()
        run: docker compose logs --tail=150

      - name: Publicar reportes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-pruebas-${{ github.run_number }}
          path: reports/
          retention-days: 14

      - name: Apagar contenedores
        if: always()
        run: docker compose down -v

  deploy:
    name: Despliegue en AWS EC2
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Configurar llave SSH
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2.pem
          chmod 600 ~/.ssh/ec2.pem
          ssh-keyscan -T 15 -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Desplegar por SSH
        id: deploy
        run: |
          start=$(date +%s)
          ssh -i ~/.ssh/ec2.pem -o ConnectTimeout=20 "${{ secrets.EC2_USER || 'ubuntu' }}@${{ secrets.EC2_HOST }}" \
            "APP_SHA=${{ github.sha }} bash -s" < scripts/deploy.sh
          echo "seconds=$(( $(date +%s) - start ))" >> "$GITHUB_OUTPUT"

      - name: Verificar el sistema publicado
        run: |
          for i in $(seq 1 20); do
            curl -fsS "http://${{ secrets.EC2_HOST }}/api/health" && exit 0
            sleep 3
          done
          exit 1

      - name: Registrar despliegue en OpenObserve
        if: always()
        run: >
          python3 scripts/o2_event.py deploy ${{ job.status }}
          --message "Despliegue ${{ job.status == 'success' && 'completado' || 'fallido' }} en EC2 (${{ github.sha }})"
          --extra '{"target": "aws-ec2", "host": "${{ secrets.EC2_HOST }}", "deploy_seconds": "${{ steps.deploy.outputs.seconds }}", "app_version": "${{ github.sha }}"}'

  blocked:
    name: Despliegue bloqueado
    needs: test
    if: failure() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Registrar bloqueo en OpenObserve
        run: >
          python3 scripts/o2_event.py deploy_blocked blocked
          --message "Las pruebas fallaron: no se abrió la conexión SSH ni se actualizó la EC2"
      - name: Marcar el bloqueo
        run: |
          echo "## Despliegue bloqueado" >> "$GITHUB_STEP_SUMMARY"
          echo "La suite de pruebas falló en el commit \`${GITHUB_SHA::7}\`; la EC2 no se tocó." >> "$GITHUB_STEP_SUMMARY"
