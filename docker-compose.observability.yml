# Observabilidad: OpenObserve + OpenTelemetry Collector + node-exporter (sensores).
# Comparte la red inventrack_net con la aplicación.
name: inventrack-obs

services:
  openobserve:
    image: public.ecr.aws/zinclabs/openobserve:v0.14.7
    restart: unless-stopped
    environment:
      ZO_ROOT_USER_EMAIL: ${ZO_ROOT_USER_EMAIL}
      ZO_ROOT_USER_PASSWORD: ${ZO_ROOT_USER_PASSWORD}
      ZO_DATA_DIR: /data
      ZO_TELEMETRY: "false"
      ZO_COMPACT_DATA_RETENTION_DAYS: "14"
    volumes:
      - o2data:/data
    ports:
      - "5080:5080"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.115.1
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yaml"]
    user: "0:0"   # necesario para leer /proc y /sys del host
    environment:
      O2_AUTH: ${O2_AUTH}
      HOST_NAME: ${HOST_NAME:-inventrack-ec2}
    volumes:
      - ./observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro
      - /:/hostfs:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - openobserve

  # Red del host (interfaces reales de la EC2) y sensores de temperatura.
  # Usa la red y los procesos del host; el collector lo lee en host.docker.internal:9100.
  node-exporter:
    image: prom/node-exporter:v1.8.2
    restart: unless-stopped
    network_mode: host
    pid: host
    command:
      - --path.rootfs=/host
      - --web.listen-address=:9100
      - --collector.disable-defaults
      - --collector.netdev
      - --collector.hwmon
      - --collector.thermal_zone
    volumes:
      - /:/host:ro,rslave

volumes:
  o2data:

networks:
  default:
    name: inventrack_net
    external: true
