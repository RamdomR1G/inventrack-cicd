# Sirve la SPA y hace de proxy inverso:
#   /api/   -> backend FastAPI
#   /otlp/  -> OpenTelemetry Collector (trazas del navegador)
# Se usa el DNS interno de Docker con variables para que nginx arranque aunque
# el collector no exista (por ejemplo en GitHub Actions).
resolver 127.0.0.11 valid=30s ipv6=off;

log_format json escape=json '{"time":"$time_iso8601","remote":"$remote_addr","method":"$request_method",'
  '"uri":"$request_uri","status":$status,"bytes":$body_bytes_sent,"rt":$request_time,'
  '"traceparent":"$http_traceparent","ua":"$http_user_agent"}';

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  access_log /var/log/nginx/access.log json;
  client_max_body_size 2m;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  location /api/ {
    set $api http://api:8000;
    proxy_pass $api;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
  }

  location /otlp/ {
    set $collector otel-collector:4318;
    rewrite ^/otlp/(.*)$ /$1 break;
    proxy_pass http://$collector;
    proxy_intercept_errors on;
    error_page 502 503 504 = @otlp_off;
  }

  location @otlp_off { return 204; }

  location /assets/ {
    expires 7d;
    add_header Cache-Control "public, immutable";
  }

  location / {
    try_files $uri /index.html;
  }
}
