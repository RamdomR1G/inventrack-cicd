[pytest]
testpaths = tests
addopts = -v -ra --browser chromium --tracing retain-on-failure --screenshot only-on-failure --output reports/artifacts --html=reports/reporte_pruebas.html --self-contained-html --junitxml=reports/junit.xml
markers =
    api: pruebas del backend (API REST) con APIRequestContext de Playwright
    e2e: pruebas de extremo a extremo del frontend con el navegador
    smoke: pruebas rápidas de humo
log_cli = false
